name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/goga211/highload-lab1

jobs:
  check:
    name: ktlint, tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # ktlint, модульные и интеграционные тесты (PostgreSQL в Testcontainers), порог покрытия 70%.
      - name: Gradle check
        run: ./gradlew check --no-daemon --console=plain

      - name: Coverage summary
        if: success()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET
          report = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          tests = failed = 0
          for path in glob.glob("build/test-results/test/*.xml"):
              suite = ET.parse(path).getroot()
              tests += int(suite.get("tests"))
              failed += int(suite.get("failures")) + int(suite.get("errors"))
          print("### Tests and coverage\n")
          print(f"Tests: {tests}, failed: {failed}\n")
          print("| Counter | Coverage |\n|---|---|")
          for counter in report.findall("counter"):
              if counter.get("type") in ("LINE", "BRANCH", "INSTRUCTION"):
                  covered, missed = int(counter.get("covered")), int(counter.get("missed"))
                  print(f"| {counter.get('type')} | {covered * 100 / (covered + missed):.1f}% |")
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
            build/reports/ktlint
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: docker image and compose smoke test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Требование лабы: всё запускается через docker compose. Поднимаем стек как на защите.
      - name: Compose smoke test
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then break; fi
            sleep 3
          done
          curl -fs http://localhost:8080/actuator/health
          curl -fs -o /dev/null http://localhost:8080/v3/api-docs
          test "$(curl -fsI 'http://localhost:8080/api/v1/vehicles?size=5' | grep -i '^x-total-count' | tr -dc '0-9')" = "8"
          echo "Stack is up, demo data loaded"

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Compose down
        if: always()
        run: docker compose down -v

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Образ собирается всегда, публикуется в ghcr.io только из main.
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
