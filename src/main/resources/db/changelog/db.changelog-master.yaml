databaseChangeLog:
  - include:
      file: users/001-users.sql
      relativeToChangelogFile: true
  - include:
      file: fleet/001-fleet.sql
      relativeToChangelogFile: true
  - include:
      file: rentals/001-rentals.sql
      relativeToChangelogFile: true
  - include:
      file: billing/001-billing.sql
      relativeToChangelogFile: true
  # Внешние ключи между доменами. В ЛР2 у каждого сервиса своя база,
  # этот ченджлог не переносится, ссылки остаются обычными uuid-колонками.
  - include:
      file: cross-domain/001-foreign-keys.sql
      relativeToChangelogFile: true
  # Демо-данные применяются только с контекстом demo (docker compose), в тестах их нет.
  - include:
      file: demo/001-demo-data.sql
      relativeToChangelogFile: true
