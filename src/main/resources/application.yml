spring:
  application:
    name: carsharing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carsharing}
    username: ${DB_USER:carsharing}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:default}
  web:
    locale: ru_RU
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}

carsharing:
  rental:
    reservation-ttl-minutes: ${RENTAL_RESERVATION_TTL_MINUTES:30}
    expiry-batch-size: ${RENTAL_EXPIRY_BATCH_SIZE:100}
    expiry-check-interval-ms: ${RENTAL_EXPIRY_CHECK_INTERVAL_MS:60000}
  fleet:
    fuel-low-threshold-percent: ${FUEL_LOW_THRESHOLD_PERCENT:15}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
